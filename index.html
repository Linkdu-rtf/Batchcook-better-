function csv(t){const o=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==',')r.push(c),c="";else if(h=='\n'){r.push(c);o.push(r);r=[];c=""}else if(h!='\r')c+=h}r.push(c);o.push(r);return o}
function catg(n){n=n.toLowerCase();if(/bœuf|boeuf|lardon|poulet|porc|jambon|veau|agneau|dinde|saucisse|steak|canard/.test(n))return CATS[0];if(/saumon|cabillaud|thon|poisson|colin|truite/.test(n))return CATS[1];if(/crevette|moule|calamar|coquille|gambas/.test(n))return CATS[2];if(/pâte(?! brisée)|spaghetti|riz|lentille|pois chiche|haricot|quinoa|semoule|nouille|boulgour|tagliatelle|penne/.test(n))return CATS[4];if(/pomme|poire|banane|citron|orange|oignon|carotte|tomate|persil|\bail\b|céleri|courgette|poivron|champignon|salade|épinard|brocoli|échalote|compote/.test(n))return CATS[3];return CATS[5]}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function matchCat(s){const x=nz(s);return x?CATS.find(c=>nz(c)==x||nz(c).startsWith(x)):null}
function mins(s){s=s||"";const h=/(\d+)\s*h\s*(\d+)?/.exec(s);if(h)return +h[1]*60+(+h[2]||0);const m=/(\d+)/.exec(s);return m?+m[1]:0}
function parse(t){const R=csv(t),H=R[0].map(nz),ix=re=>H.findIndex(h=>re.test(h));
 // Les colonnes sont retrouvées par leur titre : on peut en ajouter ou les déplacer dans le Sheet
 const C={nom:ix(/^nom/),img:ix(/^image/),cui:ix(/cuisson/),pre:ix(/temps.*preparation/),por:ix(/portion/),typ:ix(/type.*recette/),tag:ix(/^tag/),ing:ix(/liste.*ingr/),qty:ix(/quantit/),tin:ix(/type.*ingr/),ins:ix(/instruction/),not:ix(/notes|infos/),kc:ix(/calorie/),nut:ix(/nutri/)};
 const g=(r,k)=>C[k]>=0?(r[C[k]]||""):"",L=x=>x.split("\n").map(y=>y.trim()).filter(Boolean),seen={};
 return R.slice(1).filter(r=>g(r,"nom").trim()).map((r,i)=>{
  const nm=L(g(r,"ing")),ln=L(g(r,"qty")),ct=L(g(r,"tin"));
  const ing=nm.map((n,k)=>{const line=ln[k]||n,m=/^(\d+(?:[.,]\d+)?)(?:\s*(kg|g|cl|ml|l|cuillères? à soupe|cuillères? à café|gousses?|sachets?|pincée|branches?)(?=\s|$))?/i.exec(line);const clean=n.replace(/\s*\(.*\)/,"").trim();return [clean,m?parseFloat(m[1].replace(",",".")):0,m&&m[2]||"",(ct[k]&&matchCat(ct[k]))||catg(clean),line]});
  const gn=re=>{const m=re.exec(g(r,"nut"));return m?+m[1]:0},type=g(r,"typ").replace(/^-/,"").trim(),im=g(r,"img").trim();
  let id=nz(g(r,"nom")).replace(/ /g,"-")||"r"+i;while(seen[id])id+="-2";seen[id]=1;
  const k=/(\d[\d\s\u00a0\u202f]*)\s*kcal\/part/.exec(g(r,"kc"));
  return {id,nom:g(r,"nom").trim(),img:{DESSERT:"🥧","PLAT COMPLET":"🍝",PLAT:"🍽️",SALADE:"🥗",ENTREE:"🥗",POTAGE:"🍲",BOISSON:"🥤",APERITIF:"🥂",ACCOMPAGNEMENT:"🥔"}[type]||"🍽️",photo:/^https?:/i.test(im)?im:"",cuisson:mins(g(r,"cui")),prep:mins(g(r,"pre")),portions:parseInt(g(r,"por"))||1,type,tags:L(g(r,"tag")).map(x=>x.replace(/^-/,"")),ing,instr:g(r,"ins"),notes:g(r,"not"),kcal:k?+k[1].replace(/\D/g,""):0,kcalTxt:g(r,"kc").replace(/\n/g," · "),nut:g(r,"nut"),prot:gn(/Prot[ée]ines\s*(\d+)/),gluc:gn(/Glucides\s*(\d+)/),lip:gn(/Lipides\s*(\d+)/)}})}

 <button class="s" style="margin-top:18px;width:100%" onclick="nav({n:'histo',id:${c.id}})">Historique (5 semaines)</button>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="s" style="flex:1" onclick="editClient(${c.id})">Modifier le client</button><button class="s" style="flex:1;color:var(--ac2);border-color:var(--ac2)" onclick="supClient(${c.id})">Supprimer</button></div>`}
function addRdv(id){const d=$("#nd").value;if(!d)return;const c=cl(id);if(!c.rdvs.some(x=>x.d==d))c.rdvs.push({d,plats:[]});save();vClient({id})}
function delRdv(id,d){modal(`Supprimer le rendez-vous du ${fd(d)} et son menu ?`,()=>{const c=cl(id);c.rdvs=c.rdvs.filter(x=>x.d!=d);save();vClient({id})})}
function vRdv(s){
 const c=cl(s.id),pl=platsOf(c,s.d),t=totals(pl),a=`${c.id},'${s.d}'`;
 v.innerHTML=`${BK}<h1>Menu du ${fd(s.d)}</h1><div class="sub">${c.nom} · ${c.foyer} pers. dans le foyer</div>${ctags(c)}
 <h2>Repas</h2><div class="grid">`+
 pl.map((x,i)=>{const r=rec(x.r);return `<div class="meal"><div class="im" onclick="nav({n:'recette',id:'${r.id}'})">${ph(r,'100%','110px')}</div><div class="t">${r.nom}</div>
 <div class="st"><button class="s" aria-label="Moins" onclick="pers(${a},${i},-1)">−</button><b>${x.p} pers.</b><button class="s" aria-label="Plus" onclick="pers(${a},${i},1)">+</button></div>
 <div class="sub">${r.kcal*x.p} kcal</div><div style="display:flex;gap:6px;margin:6px 8px 10px"><button class="s" style="flex:1;padding:8px" onclick="nav({n:'choix',id:${c.id},d:'${s.d}',rep:${i}})">Changer</button><button class="s" style="padding:8px" aria-label="Retirer" onclick="rmPlat(${a},${i})">✕</button></div></div>`}).join("")+
 `<div class="plus" onclick="nav({n:'choix',id:${c.id},d:'${s.d}',rep:-1})">+</div></div>
 <h2>Total</h2><div class="sub">${t.k} kcal · Protéines ${t.p} g · Glucides ${t.g} g · Lipides ${t.l} g</div>
 <button class="p" style="margin-top:16px" onclick="nav({n:'courses',id:${c.id},d:'${s.d}'})">Liste de courses</button>`}
function pers(id,d,i,k){const pl=platsOf(cl(id),d);pl[i].p=Math.max(1,pl[i].p+k);save();const y=v.scrollTop;vRdv({id,d});v.scrollTop=y}
function rmPlat(id,d,i){platsOf(cl(id),d).splice(i,1);save();vRdv({id,d})}
function vChoix(s){
 v.innerHTML=`${BK}<h1>Choisir un plat</h1>`+recettes.map(r=>`<div class="row" onclick="pick(${s.id},'${s.d}','${r.id}',${s.rep})"><span style="font-size:28px;width:48px;flex:none">${ph(r,'48px','48px')}</span><div class="g"><b>${r.nom}</b><div class="sub">${r.kcal} kcal</div></div></div>`).join("")}
function pick(id,d,rid,rep){
 const c=cl(id),pl=platsOf(c,d),ok=()=>{const e={r:rid,p:c.foyer};rep>=0?pl[rep]=e:pl.push(e);save();back()};
 if(histo(c).some(h=>h.r==rid))modal(`<b>${rec(rid).nom}</b> figure déjà dans l'historique de ${c.nom} (5 dernières semaines). L'ajouter quand même ?`,ok);else ok()}
function modal(msg,yes){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><p>${msg}</p><div style="display:flex;gap:8px"><button class="s" style="flex:1" id="n">Annuler</button><button class="p" style="flex:1" id="y">Confirmer</button></div></div>`;$("#app").append(m);m.querySelector("#n").onclick=()=>m.remove();m.querySelector("#y").onclick=()=>{m.remove();yes()}}
function liste(c,d){
 const m={};platsOf(c,d).forEach(x=>{const r=rec(x.r);r.ing.forEach(([n,qt,u,cat])=>{const k=cat+"|"+n+"|"+u;m[k]=(m[k]||0)+qt*x.p/r.portions})});
 let out=`Liste de courses – ${c.nom} – ${fd(d)}\n`;
 CATS.forEach(cat=>{const it=Object.entries(m).filter(([k])=>k.startsWith(cat+"|"));if(it.length)out+=`\n${cat}\n`+it.map(([k,qt])=>{const[,n,u]=k.split("|");return qt?`- ${n} : ${q(qt)}${u?" "+u:""}`:`- ${n}`}).join("\n")+"\n"});
 return out}
const slug=s=>nz(s).replace(/ /g,"_");
async function partager(t,name,asText){
 const P=(window.Capacitor&&Capacitor.Plugins)||{},ms=$("#ms");
 try{
  if(P.Share){
   if(!asText&&P.Filesystem){const f=await P.Filesystem.writeFile({path:name,data:t,directory:"CACHE",encoding:"utf8"});await P.Share.share({title:name,files:[f.uri],dialogTitle:"Envoyer la liste de courses"});return}
   await P.Share.share({title:name,text:t,dialogTitle:"Envoyer la liste de courses"});return}
  if(navigator.share){await navigator.share({title:name,text:t});return}
  throw new Error("Partage indisponible")
 }catch(e){
  if(/cancel|abort/i.test(String(e&&(e.message||e.name||e))))return;
  try{await navigator.clipboard.writeText(t);if(ms)ms.textContent="Partage impossible : la liste a été copiée, collez-la dans votre messagerie."}catch(x){if(ms)ms.textContent="Partage impossible ("+(e&&e.message||e)+")."}}}
function vCourses(s){
 const c=cl(s.id),t=liste(c,s.d),nm=`courses_${slug(c.nom)}_${s.d}.txt`;
 v.innerHTML=`${BK}<h1>Courses</h1>${platsOf(c,s.d).length?"":'<p class="sub">Ce menu ne contient aucun plat.</p>'}<pre>${t}</pre><div id="ms" class="sub" style="margin-bottom:8px"></div><div style="display:grid;gap:8px"><button class="p" id="sh">Envoyer le fichier .txt</button><button class="s" id="st">Partager en message (texte)</button><button class="s" id="cp">Copier le texte</button></div>`;
 $("#sh").onclick=()=>partager(t,nm,false);
 $("#st").onclick=()=>partager(t,nm,true);
 $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(t);$("#cp").textContent="Copié ✓"}catch(e){$("#ms").textContent="Copie impossible."}}}
function vHisto(s){
 const c=cl(s.id),h=histo(c);
 v.innerHTML=`${BK}<h1>Historique</h1><div class="sub" style="margin-bottom:8px">${c.nom} · 5 dernières semaines</div>`+(h.map(x=>{const r=rec(x.r);return `<div class="row" style="cursor:default"><span style="font-size:28px;width:48px;flex:none">${ph(r,'48px','48px')}</span><div class="g"><b>${r.nom}</b><div class="sub">${fd(x.d)}</div></div></div>`}).join("")||'<p class="sub">Aucun repas sur cette période.</p>')}
// ---------- Nouveau client ----------
function newClient(){nf={nom:"",foyer:2,dt:"",tags:[],extra:[]};nav({n:'nouveau'})}
function editClient(id){const c=cl(id);nf={id,nom:c.nom,foyer:c.foyer,dt:"",tags:c.tags.slice(),extra:c.tags.filter(t=>!DIETS.includes(t))};nav({n:'nouveau'})}
function supClient(id){const c=cl(id);modal(`Supprimer <b>${c.nom}</b> avec tous ses rendez-vous et menus ? Cette action est définitive.`,()=>{clients=clients.filter(x=>x.id!=id);save();go("clients")})}
function vNew(){
 const all=DIETS.concat(nf.extra);
 v.innerHTML=`${BK}<h1>${nf.id?"Modifier le client":"Nouveau client"}</h1>
 <label>Nom</label><input id="nm" value="${nf.nom}" oninput="nf.nom=this.value">
 <label>Personnes dans le foyer : <b id="fv">${nf.foyer}</b></label><input type="range" min="1" max="10" value="${nf.foyer}" oninput="nf.foyer=+this.value;fv.textContent=this.value">
 ${nf.id?"":`<label>Prochain rendez-vous (facultatif)</label><input type="date" value="${nf.dt}" oninput="nf.dt=this.value">`}
 <label>Régimes alimentaires</label><div class="tags">${all.map((d,i)=>`<button class="tag ${nf.tags.includes(d)?"on":""}" onclick="tg(${i})">${d}</button>`).join("")}</div>
 <div style="display:flex;gap:8px"><input id="xd" placeholder="Autre régime ou allergie" style="margin:0"><button class="s" onclick="addD()">+ Ajouter</button></div>
 <button class="p" style="margin-top:16px" onclick="mk()">${nf.id?"Enregistrer":"Créer le client"}</button>`}
function tg(i){const d=DIETS.concat(nf.extra)[i],t=nf.tags;t.includes(d)?t.splice(t.indexOf(d),1):t.push(d);const y=v.scrollTop;vNew();v.scrollTop=y}
function addD(){const d=$("#xd").value.trim().toUpperCase();if(!d)return;if(!DIETS.concat(nf.extra).includes(d))nf.extra.push(d);if(!nf.tags.includes(d))nf.tags.push(d);const y=v.scrollTop;vNew();v.scrollTop=y}
function mk(){if(!nf.nom.trim()){$("#nm").focus();return}if(nf.id){const c=cl(nf.id);c.nom=nf.nom.trim();c.foyer=nf.foyer;c.tags=nf.tags;save();back();return}clients.push({id:Date.now(),nom:nf.nom.trim(),foyer:nf.foyer,rdvs:nf.dt?[{d:nf.dt,plats:[]}]:[],tags:nf.tags,hist:[]});save();go("clients")}
// ---------- Recettes ----------
function vRec(){
 v.innerHTML=(stack.length?BK:"")+`<div class="top"><div class="hd"><h1 style="margin:0">Recettes</h1><button class="p" style="width:auto" id="sy" onclick="sync(this)">↻ Actualiser</button></div>
 <input id="sq" style="margin:0" placeholder="Rechercher : nom, ingrédient, type…" value="${fq}" oninput="fq=this.value;fr()" onfocus="if(!fopen){fopen=true;drawF()}"></div>
 <div id="fp"></div><div class="sub" id="cn" style="margin:4px 0 8px"></div><div id="rl"></div>`;drawF();fr()}
function drawF(){const el=$("#fp");if(!el)return;
 FT=[...new Set(recettes.map(r=>r.type).filter(Boolean).concat(...recettes.map(r=>r.tags)))];
 el.innerHTML=`<div style="display:flex;gap:8px;margin:8px 0"><button class="s" style="flex:1" onclick="fopen=!fopen;drawF()">Filtrer par tags${fsel.length?" ("+fsel.length+")":""} ${fopen?"▲":"▼"}</button>${fsel.length>1?`<button class="s" onclick="fall=!fall;drawF();fr()">${fall?"ET":"OU"}</button>`:""}${fsel.length?`<button class="s" onclick="fsel=[];drawF();fr()">Effacer</button>`:""}</div>`+(fopen?`<div class="tags">${FT.map((t,i)=>`<button class="tag ${fsel.includes(t)?"on":""}" onclick="ft(${i})">${t}</button>`).join("")}</div>`:"")}
function ft(i){const t=FT[i];fsel.includes(t)?fsel.splice(fsel.indexOf(t),1):fsel.push(t);drawF();fr()}
function fr(){
 const k=fq.toLowerCase().split(/\s*,\s*|\s+ou\s+/).filter(Boolean);
 const L=recettes.filter(r=>{const lab=r.tags.concat(r.type);
  const okT=!fsel.length||(fall?fsel.every(t=>lab.includes(t)):fsel.some(t=>lab.includes(t)));
  const hay=[r.nom,r.type,...r.tags,...r.ing.map(i=>i[0])].join(" ").toLowerCase();
  return okT&&(!k.length||k.some(w=>hay.includes(w)))});
 $("#cn").textContent=L.length+" recette"+(L.length>1?"s":"");
 $("#rl").innerHTML=L.map(r=>`<div class="row" onclick="nav({n:'recette',id:'${r.id}'})"><span style="font-size:28px;width:48px;flex:none">${ph(r,'48px','48px')}</span><div class="g"><b>${r.nom}</b><div class="sub">${r.type} · ${r.prep+r.cuisson} min · ${r.tags.slice(0,3).join(", ")}</div></div><span>›</span></div>`).join("")}
function tj(id,i){const r=rec(id),t=[r.type].concat(r.tags)[i];stack.push({tab,scr});tab="recettes";scr=null;fsel=[t];fall=true;fq="";fopen=true;render()}
function vRecette(s){const r=rec(s.id);
 v.innerHTML=`${BK}${r.photo?`<img src="${r.photo}" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px" onerror="this.remove()">`:`<div style="font-size:64px">${r.img}</div>`}<h1>${r.nom}</h1>
 <div class="sub">Préparation ${r.prep} min · Cuisson ${r.cuisson} min · ${r.portions} portions</div>
 <div class="tags">${[r.type].concat(r.tags).map((t,i)=>`<button class="tag" onclick="tj('${r.id}',${i})">${t}</button>`).join("")}</div>
 <h2>Ingrédients</h2>${r.ing.map(i=>`<div>${i[4]}</div>`).join("")}
 <h2>Instructions</h2><p>${steps(r.instr)}</p>
 <h2>Nutrition</h2><div>${r.kcalTxt}<br>${r.nut}</div>
 ${r.notes?`<h2>Notes</h2><p>${steps(r.notes)}</p>`:""}`}
async function sync(b){const lb=b.textContent;try{b.textContent="Synchronisation…";const n=parse(await (await fetch(SHEET)).text());if(!n.length)throw 0;recettes=n;W("recettes_cache",n);migr();b.textContent="✓ À jour ("+n.length+")";if(tab=="recettes"&&!scr&&$("#sq")){drawF();fr()}}catch(e){b.textContent="Synchro impossible (connexion ?)"}setTimeout(()=>{b.textContent="↻ Actualiser"},2500)}
// ---------- Agenda ----------
function vAgenda(){
 const l=[];clients.forEach(c=>c.rdvs.forEach(x=>l.push({d:x.d,n:x.plats.length,c})));l.sort((a,b)=>a.d.localeCompare(b.d));
 const row=x=>`<div class="row" style="${x.d<TODAY?"opacity:.55":""}" onclick="nav({n:'rdv',id:${x.c.id},d:'${x.d}'})"><div class="g"><b>${fd(x.d)}</b><div class="sub">${x.c.nom} · ${x.n} plat(s)</div></div><span>›</span></div>`;
 const up=l.filter(x=>x.d>=TODAY),pa=l.filter(x=>x.d<TODAY).reverse();
 v.innerHTML=`<h1>Agenda</h1><h2>À venir</h2>`+(up.map(row).join("")||'<p class="sub">Aucun rendez-vous prévu.</p>')+(pa.length?`<h2>Passés</h2>`+pa.map(row).join(""):"")}
render();sync(document.createElement("button"));
try{const A=Capacitor.Plugins.App;if(A)A.addListener("backButton",()=>{const m=document.querySelector(".modal");if(m)m.remove();else if(scr||stack.length)back();else A.exitApp()})}catch(e){}
</script></body></html>
